server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Controle de acesso por e-mail: o n8n confere o JWT do Monint e responde quais recursos
    # restritos a pessoa pode usar. O workflow Portal_Acesso precisa estar publicado nesta instância
    # do n8n. Se o n8n não responder, a tela só esconde as abas restritas.
    location = /acesso {
        proxy_pass https://n8n-prod.citel.app/webhook/portal-acesso;

        proxy_set_header Host n8n-prod.citel.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;

        proxy_connect_timeout 10s;
        proxy_send_timeout 20s;
        proxy_read_timeout 20s;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Monitoramento de filas: o webhook filas-integracao do n8n (workflow
    # Monitoramento_Filas_MultiTenant) coleta as filas de todos os clientes ativos e devolve o JSON.
    # O timeout é maior porque a coleta consulta cada fila de cada cliente na hora.
    location = /filas-integracao {
        proxy_pass https://n8n-prod.citel.app/webhook/filas-integracao;

        proxy_set_header Host n8n-prod.citel.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;

        proxy_connect_timeout 10s;
        proxy_send_timeout 20s;
        proxy_read_timeout 180s;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Monitoramento de webservices: o webhook webservices-status do n8n (workflow Monitoramento_Webservices)
    # confere o JWT do Monint e devolve a última checagem guardada. Quem checa os webservices é o próprio
    # workflow, a cada minuto; esta rota só lê, então responde rápido.
    location = /webservices-status {
        proxy_pass https://n8n-prod.citel.app/webhook/webservices-status;

        proxy_set_header Host n8n-prod.citel.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;

        proxy_connect_timeout 10s;
        proxy_send_timeout 20s;
        proxy_read_timeout 30s;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Exportação de workflows: o webhook portal-wf do n8n (workflow Portal_WF_Exportar) repete a
    # checagem de acesso e devolve JSON (instâncias, clientes) ou o ZIP. O timeout é maior porque a
    # exportação lê e compacta os workflows na hora.
    location = /wf {
        proxy_pass https://n8n-prod.citel.app/webhook/portal-wf;

        proxy_set_header Host n8n-prod.citel.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Importação de workflows: o webhook portal-wf-importar do n8n (workflow Portal_WF_Importar). Os workflows
    # vão no corpo do POST (o portal manda poucos por pedido, mas um workflow grande passa de 1 MB, que é o
    # limite padrão do nginx), então o corpo pode ter até 20 MB. O n8n repete a checagem de acesso (ADMIN).
    location = /wf-importar {
        client_max_body_size 20m;
        proxy_pass https://n8n-prod.citel.app/webhook/portal-wf-importar;

        proxy_set_header Host n8n-prod.citel.app;
        # O navegador manda Origin em todo POST, e o n8n de produção responde 500 a um POST com Origin quando o
        # webhook não está registrado para o método. Chamada do mesmo site não precisa de CORS: não repassa.
        proxy_set_header Origin "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Servidor MCP de funcionalidades. Fica só na rede Docker (network_traefik, a mesma do portal e do n8n), sem DNS
    # público: o portal fala com ele pelo nome do container. O endereço fica só aqui, em $mcp_host.
    #
    # O nome vai em variável, com resolver, de propósito: com o host escrito direto no proxy_pass o nginx o resolve ao
    # SUBIR, e se o container do MCP não existe (ou caiu) ele nem inicia ("host not found in upstream") e o portal
    # inteiro cai junto. Assim o nome só é resolvido quando alguém usa a rota: sem o MCP, /mcp-status e /mcp-conexao
    # respondem 502 (o selo mostra o MCP fora do ar) e o resto do portal segue normal.
    # 127.0.0.11 é o DNS embutido do Docker.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $mcp_host mcp-funcionalidades:3002;

    # Botão "Conectar MCP": o /conexao do MCP, que devolve a URL e o token a DEV e ADM. Ao contrário do /mcp-status logo
    # abaixo, aqui o Authorization (o JWT do Monint de quem está logado) SEGUE para o MCP, que o confere na API.
    location = /mcp-conexao {
        proxy_pass http://$mcp_host/conexao;

        proxy_set_header Host $mcp_host;
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Selo "MCP ativo" da aba Funcionalidades: o /status do servidor MCP, que diz (sem token) se ele e o banco dele estão
    # de pé. O endereço é o $mcp_host lá de cima (o container mcp-funcionalidades). O cabeçalho Authorization do
    # portal não segue adiante: o MCP não precisa do JWT do Monint para isto, e o token não deve sair do portal.
    location = /mcp-status {
        proxy_pass http://$mcp_host/status;

        proxy_set_header Host $mcp_host;
        proxy_set_header Authorization "";

        proxy_connect_timeout 3s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Proxy reverso para a API — o mesmo papel que o server.proxy do Vite faz em desenvolvimento.
    location /api/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH';
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept';
            add_header 'Access-Control-Max-Age' 3600;
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain';
            return 204;
        }

        proxy_pass https://monint.citelsoftware.com.br/;

        proxy_set_header Host monint.citelsoftware.com.br;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
    }
}
