server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Controle de acesso por e-mail: o n8n confere o JWT do Monint e responde quais recursos
    # restritos a pessoa pode usar. O workflow Portal_Acesso precisa estar publicado nesta instância
    # do n8n. Se o n8n não responder, a tela só esconde as abas restritas.
    location = /acesso {
        proxy_pass https://automaker.citelsoftware.com.br/webhook/portal-acesso;

        proxy_set_header Host automaker.citelsoftware.com.br;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;

        proxy_connect_timeout 10s;
        proxy_send_timeout 20s;
        proxy_read_timeout 20s;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Exportação de workflows: o webhook portal-wf do n8n (workflow Portal_WF_Exportar) repete a
    # checagem de acesso e devolve JSON (instâncias, clientes) ou o ZIP. O timeout é maior porque a
    # exportação lê e compacta os workflows na hora.
    location = /wf {
        proxy_pass https://automaker.citelsoftware.com.br/webhook/portal-wf;

        proxy_set_header Host automaker.citelsoftware.com.br;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Proxy reverso para a API — o mesmo papel que o server.proxy do Vite faz em desenvolvimento.
    location /api/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH';
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept';
            add_header 'Access-Control-Max-Age' 3600;
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain';
            return 204;
        }

        proxy_pass https://monint.citelsoftware.com.br/;

        proxy_set_header Host monint.citelsoftware.com.br;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
    }
}
